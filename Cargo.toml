[package]
name = "maki-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dev-dependencies]
# PR #1329 landed on maki mainline: JobStart/JobExit carry data.shared,
# chat_item takes session and title, and status_segment removes with
# remove = true. Pin mainline so the tests exercise the host we install against.
maki-agent = { git = "https://github.com/tontinton/maki", rev = "2d84258235167ec7b731e523eac7d431396fa314" }
maki-lua = { git = "https://github.com/tontinton/maki", rev = "2d84258235167ec7b731e523eac7d431396fa314" }
maki-storage = { git = "https://github.com/tontinton/maki", rev = "2d84258235167ec7b731e523eac7d431396fa314" }
serde_json = "1"
smol = "2"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
# maki pins luau0-src 0.22.0 in its own lockfile; a newer build of the
# vendored Luau fails to load text chunks ("mode is 'b'"), so hold the same
# revision the host is tested against.
luau0-src = "=0.22.0+luau740"
