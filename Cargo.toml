[package]
name = "maki-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dev-dependencies]
# This revision of the job-ui branch carries tontinton PR #1329 after the
# review: JobStart/JobExit with data.shared, chat_item keyed by session with
# a required title and a cancelled status, and status_segment removal via
# remove = true. None of it is in a tontinton/maki release yet. The shared
# flag is what lets `/tasks` list and stop a monitor. Re-point at
# tontinton/maki once the PR lands.
maki-agent = { git = "https://github.com/lu-zero/maki", rev = "229386fb" }
maki-lua = { git = "https://github.com/lu-zero/maki", rev = "229386fb" }
maki-storage = { git = "https://github.com/lu-zero/maki", rev = "229386fb" }
serde_json = "1"
smol = "2"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
# maki pins luau0-src 0.22.0 in its own lockfile; a newer build of the
# vendored Luau fails to load text chunks ("mode is 'b'"), so hold the same
# revision the host is tested against.
luau0-src = "=0.22.0+luau740"
