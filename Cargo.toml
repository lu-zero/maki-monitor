[package]
name = "maki-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dev-dependencies]
# The job UI APIs (JobStart/JobExit with data.shared, chat_item taking session
# and title, status_segment with remove = true) are in PR #1329, merged on maki
# mainline as 2b6aaeeb AFTER the v0.7.3 tag, so v0.7.3 does not have them yet.
# Pin that merge commit: the first mainline revision the tests can run against.
maki-agent = { git = "https://github.com/tontinton/maki", rev = "2b6aaeeb" }
maki-lua = { git = "https://github.com/tontinton/maki", rev = "2b6aaeeb" }
maki-storage = { git = "https://github.com/tontinton/maki", rev = "2b6aaeeb" }
serde_json = "1"
smol = "2"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
# maki pins luau0-src 0.22.0 in its own lockfile; a newer build of the
# vendored Luau fails to load text chunks ("mode is 'b'"), so hold the same
# revision the host is tested against.
luau0-src = "=0.22.0+luau740"
